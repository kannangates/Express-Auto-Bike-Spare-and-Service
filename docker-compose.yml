# Base — shared services used by all modes.
# Never run this file directly. Use:
#   Local dev  : docker-compose -f docker-compose.yml -f docker-compose-local.yml up -d
#   Public/shop: docker-compose -f docker-compose.yml -f docker-compose-trycloudflare.yml up -d

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: express-auto-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-express_auto_bike}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - express-auto-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: express-auto-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - express-auto-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: express-auto-celery-worker
    env_file:
      - .env
    environment:
      - DEBUG=0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - express-auto-network
    restart: unless-stopped
    command: celery -A express_auto_bike worker -l info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: express-auto-celery-beat
    env_file:
      - .env
    environment:
      - DEBUG=0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - express-auto-network
    restart: unless-stopped
    command: celery -A express_auto_bike beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

volumes:
  postgres_data:
  redis_data:
  backend_media:
  backend_static:

networks:
  express-auto-network:
    driver: bridge
